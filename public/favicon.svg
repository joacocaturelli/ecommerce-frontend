<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="100" height="100" fill="#f4f0bb" rx="20"/>
  
  <!-- Bolsa de compras estilizada con los colores de la app -->
  <!-- Asa -->
  <path d="M 30 30 Q 30 15 50 15 Q 70 15 70 30" 
        stroke="#66101f" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Cuerpo de la bolsa -->
  <path d="M 28 30 L 22 60 Q 22 75 35 80 L 65 80 Q 78 75 78 60 L 72 30 Z" 
        fill="#66101f" stroke="#66101f" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Detalles interiores - accento verde (color secundario) -->
  <ellipse cx="50" cy="50" rx="16" ry="12" fill="#5b8c5a" opacity="0.3"/>
  
  <!-- Pequeño detalle en la parte superior de la bolsa -->
  <rect x="32" y="28" width="36" height="4" fill="#5b8c5a" rx="2"/>
  
  <!-- Punto de énfasis - pequeño círculo en el centro (amarillo limón) -->
  <circle cx="50" cy="55" r="4" fill="#f4f0bb"/>
</svg>
